<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MECHA STRIKE // RAW EDITION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');

        :root {
            --c-red: #FF1010;
            --c-blue: #1030FF;
            --c-yellow: #FFD600;
            --c-black: #0A0A0A;
            --c-white: #F4F4F0;
            --border-thick: 4px solid var(--c-black);
            --shadow-brutal: 6px 6px 0px var(--c-black);
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--c-black);
            font-family: 'Space Mono', monospace; color: var(--c-black);
            overflow: hidden; user-select: none; touch-action: none;
        }

        /* Diagonal warning stripes for background */
        .bg-stripes {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            background: repeating-linear-gradient( 45deg, #111, #111 20px, #1a1a1a 20px, #1a1a1a 40px );
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; opacity: 1; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .hidden { transform: translateY(-120%); pointer-events: none; }

        /* Brutalist Box Container */
        .brutal-box {
            background: var(--c-white); border: var(--border-thick);
            box-shadow: 12px 12px 0px var(--c-yellow); padding: 40px 30px;
            display: flex; flex-direction: column; align-items: center;
            position: relative; max-width: 90%; width: 500px;
        }
        
        .brutal-box::before {
            content: 'SYS.V.2.0'; position: absolute; top: -15px; left: 20px;
            background: var(--c-yellow); border: var(--border-thick);
            padding: 2px 10px; font-weight: bold; font-size: 14px;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif; font-size: 65px; margin: 0 0 30px 0;
            text-transform: uppercase; line-height: 0.9; text-align: center;
            letter-spacing: 2px; color: var(--c-black);
            text-shadow: 4px 4px 0px var(--c-red);
        }
        h1 span {
            display: block; font-size: 30px; letter-spacing: 5px;
            background: var(--c-black); color: var(--c-yellow);
            padding: 5px; margin-top: 10px; text-shadow: none;
        }

        /* BRUTALIST BUTTONS */
        .btn {
            background: var(--c-white); border: var(--border-thick); color: var(--c-black);
            padding: 15px 30px; font-size: 24px; font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 2px; margin: 10px 0; cursor: pointer;
            width: 100%; text-align: center; position: relative;
            box-shadow: var(--shadow-brutal); transition: all 0.1s;
            text-transform: uppercase;
        }
        .btn:active { box-shadow: 0px 0px 0px var(--c-black); transform: translate(6px, 6px); }
        
        .btn-red { background: var(--c-red); color: white; }
        .btn-blue { background: var(--c-blue); color: white; }
        .btn-yellow { background: var(--c-yellow); color: var(--c-black); }

        /* Grid Settings */
        .settings-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
            width: 100%; max-height: 50vh; overflow-y: auto;
            margin-bottom: 20px; padding-right: 10px;
        }
        .settings-grid::-webkit-scrollbar { width: 10px; border-left: 2px solid var(--c-black); }
        .settings-grid::-webkit-scrollbar-track { background: var(--c-white); }
        .settings-grid::-webkit-scrollbar-thumb { background: var(--c-black); }

        .setting-item {
            background: #eee; border: 2px solid var(--c-black); padding: 10px;
            display: flex; flex-direction: column; justify-content: center;
        }
        .setting-item label { font-size: 12px; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }
        .setting-item select, .setting-item input[type="number"] {
            background: var(--c-white); border: 2px solid var(--c-black);
            font-family: 'Space Mono', monospace; font-size: 14px; font-weight: bold;
            padding: 5px; cursor: pointer; color: var(--c-black);
        }
        .setting-item input[type="range"] {
            -webkit-appearance: none; width: 100%; background: transparent;
        }
        .setting-item input[type="range"]::-webkit-slider-runnable-track {
            width: 100%; height: 10px; background: var(--c-black); border: 1px solid var(--c-black);
        }
        .setting-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 20px; width: 15px; background: var(--c-yellow);
            border: 2px solid var(--c-black); margin-top: -6px; cursor: pointer;
        }

        /* Field Selection */
        .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-bottom: 20px; }
        .field-option {
            background: var(--c-white); border: var(--border-thick); padding: 20px 10px;
            cursor: pointer; text-align: center; font-family: 'Bebas Neue', sans-serif;
            font-size: 22px; transition: 0.1s; box-shadow: 4px 4px 0px var(--c-black);
        }
        .field-option:active { box-shadow: 0px 0px 0px var(--c-black); transform: translate(4px, 4px); }
        .field-option.selected { background: var(--c-yellow); color: var(--c-black); }

        /* GAME UI */
        #game-container {
            display: none; width: 100%; height: 100%; position: relative; background: var(--c-black);
        }
        #canvas-wrapper { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
        
        #hud {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            display: flex; justify-content: space-between; align-items: center;
            width: 95%; max-width: 600px; z-index: 20; pointer-events: none;
        }
        
        .score-block {
            background: var(--c-white); border: var(--border-thick);
            padding: 5px 15px; display: flex; align-items: center; gap: 10px;
            font-family: 'Bebas Neue', sans-serif; font-size: 30px; box-shadow: 4px 4px 0px var(--c-black);
        }
        .p1-score { color: var(--c-red); }
        .p2-score { color: var(--c-blue); }
        .score-block span {
            background: var(--c-black); color: white; padding: 2px 12px; font-size: 35px;
        }

        #timer-box {
            background: var(--c-yellow); border: var(--border-thick); color: var(--c-black);
            font-family: 'Space Mono', monospace; font-size: 20px; font-weight: bold;
            padding: 8px 15px; box-shadow: 4px 4px 0px var(--c-black);
        }

        .popup-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            background: var(--c-black); border: var(--border-thick); color: var(--c-yellow);
            font-family: 'Bebas Neue', sans-serif; font-size: 80px; padding: 20px 40px;
            text-align: center; pointer-events: none; opacity: 0; z-index: 50;
            box-shadow: 15px 15px 0px var(--c-red);
        }
        .popup-text.show {
            animation: stampAnim 1.2s cubic-bezier(0.2, 1.4, 0.4, 1) forwards;
        }
        @keyframes stampAnim {
            0% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
            30% { transform: translate(-50%, -50%) scale(1) rotate(-5deg); opacity: 1; }
            70% { transform: translate(-50%, -50%) scale(1) rotate(-5deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
        }

        /* Mobile specific */
        @media (max-width: 600px) {
            h1 { font-size: 50px; } h1 span { font-size: 22px; }
            .brutal-box { padding: 30px 20px; width: 95%; }
            .settings-grid { grid-template-columns: 1fr; max-height: 60vh; }
            .score-block { font-size: 20px; padding: 5px 10px; }
            .score-block span { font-size: 24px; padding: 2px 8px; }
            #timer-box { font-size: 16px; padding: 5px 10px; }
            .popup-text { font-size: 50px; padding: 10px 20px; box-shadow: 8px 8px 0px var(--c-red); }
        }
    </style>
</head>
<body>

<div class="bg-stripes" id="bg-anim"></div>

<!-- MAIN MENU -->
<div id="main-menu" class="screen">
    <div class="brutal-box">
        <h1>MECHA STRIKE<br><span>// RAW EDITION</span></h1>
        <button class="btn btn-red" onclick="startGame('1v1')">[ PLAY : 1 V 1 ]</button>
        <button class="btn btn-blue" onclick="startGame('bot')">[ PLAY : VS C.P.U ]</button>
        <button class="btn btn-yellow" onclick="showScreen('field-menu')">ENVIRONMENT</button>
        <button class="btn" onclick="showScreen('settings-menu')">SYSTEM CONFIG</button>
    </div>
</div>

<!-- FIELD SELECTION -->
<div id="field-menu" class="screen hidden">
    <div class="brutal-box" style="width: 600px;">
        <h1 style="font-size: 40px; margin-bottom: 20px;">ENVIRONMENT MAP</h1>
        <div class="field-grid">
            <div class="field-option selected" id="f-hazard" onclick="selectField('hazard')">HAZARD ZONE</div>
            <div class="field-option" id="f-blueprint" onclick="selectField('blueprint')">BLUEPRINT</div>
            <div class="field-option" id="f-terminal" onclick="selectField('terminal')">TERMINAL CRT</div>
            <div class="field-option" id="f-minimal" onclick="selectField('minimal')">STRICT MINIMAL</div>
        </div>
        <button class="btn btn-red" onclick="showScreen('main-menu')">SAVE & EXIT</button>
    </div>
</div>

<!-- SETTINGS MENU -->
<div id="settings-menu" class="screen hidden">
    <div class="brutal-box" style="max-width: 800px; width: 95%;">
        <h1 style="font-size: 40px; margin-bottom: 20px;">SYSTEM CONFIGURATION</h1>
        <div class="settings-grid">
            <div class="setting-item"><label>Win Score</label><input type="number" id="cfg-winscore" value="5" min="1"></div>
            <div class="setting-item"><label>Time Limit</label><select id="cfg-timelimit"><option value="60">60 SEC</option><option value="120">120 SEC</option><option value="9999" selected>NO LIMIT</option></select></div>
            <div class="setting-item"><label>Mecha Disk Size</label><input type="range" id="cfg-strikerrad" min="16" max="35" value="24"></div>
            <div class="setting-item"><label>Core Ball Size</label><input type="range" id="cfg-ballradius" min="10" max="22" value="14"></div>
            <div class="setting-item"><label>Max Kinetic Speed</label><input type="range" id="cfg-speed" min="15" max="45" value="30"></div>
            <div class="setting-item"><label>Collision Bounciness</label><input type="range" id="cfg-elasticity" min="8" max="15" value="11"></div>
            <div class="setting-item"><label>C.P.U Behavior</label><select id="cfg-botstyle"><option value="balanced" selected>BALANCED</option><option value="rush">AGGRESSIVE</option><option value="wall">DEFENSIVE</option></select></div>
            <div class="setting-item"><label>Field Gravity</label><select id="cfg-gravity"><option value="0" selected>ZERO-G</option><option value="0.25">DOWN FORCE</option><option value="-0.25">UP FORCE</option></select></div>
            <div class="setting-item"><label>Warp Portals</label><select id="cfg-portals"><option value="true" selected>ENABLED</option><option value="false">DISABLED</option></select></div>
            <div class="setting-item"><label>Void Anomalies</label><select id="cfg-blackhole"><option value="true">ENABLED</option><option value="false" selected>DISABLED</option></select></div>
            <div class="setting-item"><label>Moving Blocks</label><select id="cfg-obstacles"><option value="true" selected>ENABLED</option><option value="false">DISABLED</option></select></div>
            <div class="setting-item"><label>Energy System (Stamina)</label><select id="cfg-stamina"><option value="true" selected>ACTIVE</option><option value="false">BYPASS</option></select></div>
            <div class="setting-item"><label>Impact Slow-Mo</label><select id="cfg-slowmo"><option value="true" selected>ON</option><option value="false">OFF</option></select></div>
            <div class="setting-item"><label>Screen Shake (VFX)</label><select id="cfg-shake"><option value="true" selected>MAX</option><option value="false">OFF</option></select></div>
        </div>
        <button class="btn btn-yellow" onclick="applySettings()">APPLY PROTOCOLS</button>
    </div>
</div>

<!-- GAME OVER -->
<div id="game-over-screen" class="screen hidden">
    <div class="brutal-box">
        <h1 id="winner-text" style="font-size: 55px; margin-bottom: 10px;">VICTORY</h1>
        <p id="winner-sub" style="font-weight: bold; margin-bottom: 30px; background: var(--c-black); color: var(--c-yellow); padding: 5px 15px;">MATCH TERMINATED</p>
        <button class="btn btn-red" onclick="showScreen('main-menu')">RETURN TO BASE</button>
    </div>
</div>

<!-- GAME CONTAINER -->
<div id="game-container">
    <div id="hud">
        <div class="score-block p2-score">P2 <span id="score2">0</span></div>
        <div id="timer-box">00:00</div>
        <div class="score-block p1-score"><span id="score1">0</span> P1</div>
    </div>
    <div id="canvas-wrapper">
        <canvas id="gameCanvas"></canvas>
        <div id="popup" class="popup-text">GOAL!</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false }); // Optimizasyon için alpha false (arkaplanı hep biz çizeceğiz)
    
    // Basit ve Sert Ses Motoru (Retro 8-bit tarzı)
    let audioCtx = null;
    function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function playTone(freq, type, duration, vol=0.1) {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    let cfg = { 
        winScore: 5, timeLimit: 9999, gravity: 0, ballRadius: 14, elasticity: 1.1,
        usePortals: true, useBlackhole: false, useStamina: true, botStyle: 'balanced',
        maxSpeed: 30, strikerRad: 24, shake: true, useSlowMo: true, useObstacles: true
    };

    let score1 = 0, score2 = 0, currentPlayer = 1, currentMode = '1v1', gameState = 'waiting', gameLoopId;
    let frameCount = 0, matchTimer = 0, matchSeconds = 0, timeScale = 1;
    let currentTheme = 'hazard';
    let particles = [], trails = [], shakeTime = 0, wallCombo = 0;
    
    let balls = [], strikers = [], goalPosts = [], obstacles = [], portals = [], blackHoles = [], powerUps = [];
    let goalWidth, goalX;
    let selectedStriker = null, dragStart = { x: 0, y: 0 }, dragCurrent = { x: 0, y: 0 };

    function resizeCanvas() {
        const wrapper = document.getElementById('canvas-wrapper');
        canvas.width = wrapper.clientWidth;
        canvas.height = wrapper.clientHeight;
        setupEnvironment();
    }
    window.addEventListener('resize', () => { if(gameState !== 'gameover' && document.getElementById('game-container').style.display === 'block') resizeCanvas(); });

    function setupEnvironment() {
        goalWidth = Math.max(160, canvas.width * 0.35);
        if(goalWidth > 280) goalWidth = 280;
        goalX = (canvas.width - goalWidth) / 2;

        // Kare Kale Direkleri (Brutalist style)
        goalPosts = [
            {x: goalX, y: -5, r: 12, w: 24, h: 24, m: Infinity, isStatic: true, color: '#0A0A0A'}, 
            {x: goalX + goalWidth, y: -5, r: 12, w: 24, h: 24, m: Infinity, isStatic: true, color: '#0A0A0A'},
            {x: goalX, y: canvas.height+5, r: 12, w: 24, h: 24, m: Infinity, isStatic: true, color: '#0A0A0A'}, 
            {x: goalX + goalWidth, y: canvas.height+5, r: 12, w: 24, h: 24, m: Infinity, isStatic: true, color: '#0A0A0A'}
        ];

        portals = cfg.usePortals ? [
            {x: canvas.width * 0.15, y: canvas.height * 0.5, r: 28, targetIdx: 1, color: '#FF1010'},
            {x: canvas.width * 0.85, y: canvas.height * 0.5, r: 28, targetIdx: 0, color: '#1030FF'}
        ] : [];

        blackHoles = cfg.useBlackhole ? [
            {x: canvas.width * 0.5, y: canvas.height * 0.33, pull: 0.4, r: 35},
            {x: canvas.width * 0.5, y: canvas.height * 0.67, pull: 0.4, r: 35}
        ] : [];

        obstacles = cfg.useObstacles ? [
            { x: canvas.width * 0.25, y: canvas.height * 0.25, r: 22, m: Infinity, color: '#FFD600', isStatic: true, dir: 1, hp: 5 },
            { x: canvas.width * 0.75, y: canvas.height * 0.75, r: 22, m: Infinity, color: '#FFD600', isStatic: true, dir: -1, hp: 5 }
        ] : [];
    }

    // Kare Parçacıklar Sistemi (No Blur, No Fade - Hard pop out)
    class Spark {
        constructor(x, y, color, speedScale=1) {
            this.x = x; this.y = y; this.color = color;
            let angle = Math.random() * Math.PI * 2; let speed = (Math.random() * 10 + 4) * speedScale;
            this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
            this.size = Math.random() * 8 + 4;
            this.life = 1; this.decay = Math.random() * 0.05 + 0.02;
            this.rot = Math.random() * Math.PI; this.rotSpeed = (Math.random() - 0.5) * 0.4;
        }
        update() { 
            this.x += this.vx * timeScale; this.y += this.vy * timeScale; 
            this.vx *= 0.90; this.vy *= 0.90; 
            this.rot += this.rotSpeed;
            this.life -= this.decay * timeScale; 
        }
        draw() {
            if(this.life <= 0) return;
            ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rot);
            let s = this.size * this.life; // Büyüklük azalarak yok olur
            ctx.fillStyle = this.color; ctx.fillRect(-s/2, -s/2, s, s);
            ctx.lineWidth = 2; ctx.strokeStyle = '#0A0A0A'; ctx.strokeRect(-s/2, -s/2, s, s);
            ctx.restore();
        }
    }

    function createSparks(x, y, color, scale=1) {
        for(let i=0; i<15; i++) particles.push(new Spark(x, y, color, scale));
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById('game-container').style.display = 'none';
        document.getElementById('bg-anim').style.display = screenId === 'game' ? 'none' : 'block';

        if (screenId === 'game') {
            document.getElementById('game-container').style.display = 'block';
            resizeCanvas();
        } else {
            document.getElementById(screenId).classList.remove('hidden');
        }
    }

    function selectField(id) {
        currentTheme = id;
        document.querySelectorAll('.field-option').forEach(el => el.classList.remove('selected'));
        document.getElementById('f-'+id).classList.add('selected');
    }

    function applySettings() {
        cfg.strikerRad = parseInt(document.getElementById('cfg-strikerrad').value);
        cfg.winScore = parseInt(document.getElementById('cfg-winscore').value);
        cfg.timeLimit = parseInt(document.getElementById('cfg-timelimit').value);
        cfg.gravity = parseFloat(document.getElementById('cfg-gravity').value);
        cfg.ballRadius = parseInt(document.getElementById('cfg-ballradius').value);
        cfg.elasticity = parseInt(document.getElementById('cfg-elasticity').value) / 10;
        cfg.usePortals = document.getElementById('cfg-portals').value === 'true';
        cfg.useBlackhole = document.getElementById('cfg-blackhole').value === 'true';
        cfg.useStamina = document.getElementById('cfg-stamina').value === 'true';
        cfg.botStyle = document.getElementById('cfg-botstyle').value;
        cfg.maxSpeed = parseInt(document.getElementById('cfg-speed').value);
        cfg.shake = document.getElementById('cfg-shake').value === 'true';
        cfg.useSlowMo = document.getElementById('cfg-slowmo').value === 'true';
        cfg.useObstacles = document.getElementById('cfg-obstacles').value === 'true';
        showScreen('main-menu');
    }

    function startGame(mode) {
        initAudio(); currentMode = mode; score1 = 0; score2 = 0; currentPlayer = 1;
        matchSeconds = 0; matchTimer = 0; wallCombo = 0; timeScale = 1;
        balls = []; powerUps = []; particles = []; trails = [];
        
        strikers = [
            { id: 1, x: 0, y: 0, r: cfg.strikerRad, vx: 0, vy: 0, m: 14, color: '#FF1010', stamina: 100 },
            { id: 2, x: 0, y: 0, r: cfg.strikerRad, vx: 0, vy: 0, m: 14, color: '#1030FF', stamina: 100 }
        ];
        
        showScreen('game');
        resetPositions();
        updateUI();
        if (gameLoopId) cancelAnimationFrame(gameLoopId);
        gameLoop();
    }

    function triggerShake() { if(cfg.shake) shakeTime = 10; }

    function spawnPowerUp() {
        if(powerUps.length >= 1) return; // Azaltılmış güçlendirme spam'i
        const types = [{t: 'M', c: '#00FF00'}, {t: 'G', c: '#A200FF'}, {t: 'S', c: '#FF8800'}, {t: 'D', c: '#00E5FF'}];
        let p = types[Math.floor(Math.random() * types.length)];
        powerUps.push({
            x: Math.random() * (canvas.width - 120) + 60,
            y: Math.random() * (canvas.height - 300) + 150,
            r: 18, type: p.t, color: p.c, rot: 0
        });
        createSparks(powerUps[0].x, powerUps[0].y, p.c, 1);
    }

    function botTurn() {
        if (currentMode !== 'bot' || currentPlayer !== 2 || gameState !== 'waiting') return;
        let targetBall = balls[0]; if(!targetBall) return;

        let botS = strikers[1];
        let reactionDelay = cfg.botStyle === 'rush' ? 150 : (cfg.botStyle === 'wall' ? 350 : 250);

        setTimeout(() => {
            if (gameState !== 'waiting') return;
            let targetX = targetBall.x; let targetY = targetBall.y;
            if (cfg.botStyle === 'wall') targetX += (Math.random() - 0.5) * 100; // Defansif sapma

            let dx = targetX - botS.x; let dy = targetY - botS.y;
            
            dragStart = { x: botS.x, y: botS.y };
            dragCurrent = { x: botS.x - dx * 0.8, y: botS.y - dy * 0.8 };
            selectedStriker = botS; gameState = 'dragging';
            
            setTimeout(() => {
                if(gameState === 'dragging') endInteraction({preventDefault:()=>{}});
            }, 150);
        }, reactionDelay);
    }

    function update() {
        frameCount++;
        
        if(gameState !== 'gameover') {
            matchTimer++;
            if(matchTimer >= 60) {
                matchTimer = 0; matchSeconds++;
                let displaySec = matchSeconds % 60; let displayMin = Math.floor(matchSeconds / 60);
                document.getElementById('timer-box').innerText = 
                    (displayMin < 10 ? "0"+displayMin : displayMin) + ":" + (displaySec < 10 ? "0"+displaySec : displaySec);
                
                if(matchSeconds >= cfg.timeLimit) handleTimeOut();
            }
        }

        obstacles.forEach(obs => {
            obs.x += obs.dir * 2.2 * timeScale;
            if(obs.x - obs.r < 40 || obs.x + obs.r > canvas.width - 40) obs.dir *= -1;
        });

        if(Math.random() < 0.002) spawnPowerUp();

        // Slow-mo Trigger
        let nearGoal = false;
        if(cfg.useSlowMo) {
            balls.forEach(b => {
                if((b.y < 90 && b.x > goalX && b.x < goalX+goalWidth) || (b.y > canvas.height - 90 && b.x > goalX && b.x < goalX+goalWidth)) {
                    nearGoal = true;
                }
            });
            timeScale += (nearGoal ? -0.1 : 0.1); 
            if(timeScale < 0.25) timeScale = 0.25; if(timeScale > 1) timeScale = 1;
        } else { timeScale = 1; }

        if (gameState === 'moving') {
            let isMoving = false;
            const substeps = 5; 
            let entities = [...balls, ...strikers, ...goalPosts, ...obstacles];

            for (let step = 0; step < substeps; step++) {
                balls.forEach((ball) => {
                    let speed = Math.hypot(ball.vx, ball.vy);

                    // Blocky Trails
                    if (step === 0 && speed > 4 && frameCount % 2 === 0) {
                        trails.push({x: ball.x, y: ball.y, size: ball.r*1.2, color: ball.color});
                        if (trails.length > 15) trails.shift();
                    }

                    ball.vy += cfg.gravity / substeps;

                    blackHoles.forEach(bh => {
                        let distBH = Math.hypot(bh.x - ball.x, bh.y - ball.y);
                        if(distBH < 260 && distBH > 5) {
                            let force = Math.pow((1 - distBH / 260), 2) * bh.pull;
                            ball.vx += ((bh.x - ball.x) / distBH) * force / substeps;
                            ball.vy += ((bh.y - ball.y) / distBH) * force / substeps;
                        }
                    });

                    ball.x += ball.vx * timeScale / substeps;
                    ball.y += ball.vy * timeScale / substeps;

                    if (speed > cfg.maxSpeed) { ball.vx = (ball.vx/speed)*cfg.maxSpeed; ball.vy = (ball.vy/speed)*cfg.maxSpeed; }
                    ball.vx *= Math.pow(0.99, timeScale/substeps); ball.vy *= Math.pow(0.99, timeScale/substeps);

                    if (Math.abs(ball.vx) > 0.15 || Math.abs(ball.vy) > 0.15) isMoving = true;

                    // Hard Wall Collisions
                    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx *= -0.9; wallCombo++; createSparks(0, ball.y, '#F4F4F0'); playTone(250, 'square', 0.05); }
                    if (ball.x + ball.r > canvas.width) { ball.x = canvas.width - ball.r; ball.vx *= -0.9; wallCombo++; createSparks(canvas.width, ball.y, '#F4F4F0'); playTone(250, 'square', 0.05); }

                    if (ball.y - ball.r < 0) {
                        if (ball.x > goalX && ball.x < goalX + goalWidth) { handleGoal(1); return; }
                        else { ball.y = ball.r; ball.vy *= -0.9; wallCombo++; createSparks(ball.x, 0, '#F4F4F0'); playTone(250, 'square', 0.05); }
                    }
                    if (ball.y + ball.r > canvas.height) {
                        if (ball.x > goalX && ball.x < goalX + goalWidth) { handleGoal(2); return; }
                        else { ball.y = canvas.height - ball.r; ball.vy *= -0.9; wallCombo++; createSparks(ball.x, canvas.height, '#F4F4F0'); playTone(250, 'square', 0.05); }
                    }

                    // Portal
                    portals.forEach(p => {
                        if(Math.hypot(ball.x - p.x, ball.y - p.y) < ball.r + p.r - 8) {
                            let targetPortal = portals[p.targetIdx];
                            ball.x = targetPortal.x + (ball.vx > 0 ? 35 : -35);
                            ball.y = targetPortal.y + (ball.vy > 0 ? 35 : -35);
                            ball.vx *= 1.1; ball.vy *= 1.1; 
                            playTone(600, 'sawtooth', 0.1, 0.2); triggerShake();
                            createSparks(p.x, p.y, '#F4F4F0', 2);
                            createSparks(targetPortal.x, targetPortal.y, '#F4F4F0', 2);
                        }
                    });

                    // PowerUp
                    powerUps.forEach((pu, puIdx) => {
                        if (Math.hypot(ball.x - pu.x, ball.y - pu.y) < ball.r + pu.r) {
                            activatePowerUp(pu.type); createSparks(pu.x, pu.y, pu.color, 1.5);
                            powerUps.splice(puIdx, 1);
                        }
                    });
                });

                strikers.forEach(s => {
                    s.x += s.vx * timeScale / substeps; s.y += s.vy * timeScale / substeps;
                    s.vx *= Math.pow(0.82, timeScale/substeps); s.vy *= Math.pow(0.82, timeScale/substeps);
                    if (Math.abs(s.vx) > 0.1 || Math.abs(s.vy) > 0.1) isMoving = true;

                    if (s.x - s.r < 0) { s.x = s.r; s.vx *= -0.5; }
                    if (s.x + s.r > canvas.width) { s.x = canvas.width - s.r; s.vx *= -0.5; }
                    if (s.y - s.r < 0) { s.y = s.r; s.vy *= -0.5; }
                    if (s.y + s.r > canvas.height) { s.y = canvas.height - s.r; s.vy *= -0.5; }

                    if(cfg.useStamina && s.stamina < 100) s.stamina += 0.12;
                });

                for (let i=0; i<entities.length; i++) {
                    for (let j=i+1; j<entities.length; j++) resolveCollision(entities[i], entities[j]);
                }
            }

            if (!isMoving && balls.every(b => Math.hypot(b.vx, b.vy) < 0.1)) {
                gameState = 'waiting'; currentPlayer = currentPlayer === 1 ? 2 : 1;
                wallCombo = 0; updateUI(); 
                if (currentMode === 'bot' && currentPlayer === 2) botTurn();
            }
        }
        
        particles.forEach((p, index) => { p.update(); if(p.life <= 0) particles.splice(index, 1); });
        trails.forEach(t => t.size -= 0.8 * timeScale);
        trails = trails.filter(t => t.size > 2);
    }

    function activatePowerUp(type) {
        playTone(700, 'square', 0.1, 0.2); playTone(900, 'square', 0.15, 0.2); triggerShake();
        let currentStriker = strikers[currentPlayer - 1];

        if(type === 'M') { // Multiball
            balls.push({ x: canvas.width/2, y: canvas.height/2, r: cfg.ballRadius, vx: (Math.random()-0.5)*25, vy: (Math.random()-0.5)*25, m: 0.9, color: '#00FF00' });
        } else if(type === 'S') { // Shrink
            currentStriker.r = cfg.strikerRad * 0.55;
            setTimeout(() => { currentStriker.r = cfg.strikerRad; createSparks(currentStriker.x, currentStriker.y, '#FF8800', 1.5); }, 7000);
        } else if(type === 'G') { // Gravity/Magnet
            balls.forEach(targetBall => {
                targetBall.vx += (currentStriker.x - targetBall.x) * 0.45;
                targetBall.vy += (currentStriker.y - targetBall.y) * 0.45;
            });
        } else if(type === 'D') { // Defense Wall
            let shieldY = currentPlayer === 1 ? canvas.height - 30 : 30;
            let shield = { x: canvas.width/2, y: shieldY, r: goalWidth/2.2, m: Infinity, color: '#00E5FF', isStatic: true, dir: 0, hp: 999, isShield: true };
            obstacles.push(shield);
            setTimeout(() => { obstacles = obstacles.filter(o => o !== shield); }, 8000);
        }
    }

    function resolveCollision(c1, c2) {
        if (!c1 || !c2) return;
        let dx = c2.x - c1.x; let dy = c2.y - c1.y;
        let distSq = dx*dx + dy*dy; let minDist = c1.r + c2.r;

        if (distSq < minDist*minDist && distSq > 0) {
            let dist = Math.sqrt(distSq); let nx = dx / dist; let ny = dy / dist;
            let overlap = minDist - dist;

            let invM1 = c1.isStatic ? 0 : 1 / c1.m; let invM2 = c2.isStatic ? 0 : 1 / c2.m;
            let sumInvM = invM1 + invM2; if (sumInvM === 0) return;

            let correction = overlap / sumInvM;
            if (!c1.isStatic) { c1.x -= nx * correction * invM1; c1.y -= ny * correction * invM1; }
            if (!c2.isStatic) { c2.x += nx * correction * invM2; c2.y += ny * correction * invM2; }

            let kx = (c2.vx || 0) - (c1.vx || 0); let ky = (c2.vy || 0) - (c1.vy || 0);
            let velAlongNormal = kx * nx + ky * ny;
            if (velAlongNormal > 0) return;

            let restitution = cfg.elasticity;
            let j = -(1 + restitution) * velAlongNormal; j /= sumInvM;
            let impulseX = j * nx; let impulseY = j * ny;

            if (!c1.isStatic) { c1.vx -= impulseX * invM1; c1.vy -= impulseY * invM1; }
            if (!c2.isStatic) { c2.vx += impulseX * invM2; c2.vy += impulseY * invM2; }
            
            if (balls.includes(c1) || balls.includes(c2)) {
                let hitBall = balls.includes(c1) ? c1 : c2;
                let strikerHit = strikers.includes(c1) ? c1 : (strikers.includes(c2) ? c2 : null);
                
                if(strikerHit) {
                    createSparks(hitBall.x, hitBall.y, strikerHit.color, 1.5);
                    playTone(200, 'square', 0.1, 0.2); 
                } else {
                    createSparks(hitBall.x, hitBall.y, '#FFD600', 0.8);
                    playTone(300, 'square', 0.08, 0.1);
                }
                triggerShake();

                if(obstacles.includes(c1) && !c1.isShield) { c1.hp--; if(c1.hp<=0) { obstacles = obstacles.filter(o=>o!==c1); createSparks(c1.x, c1.y, c1.color, 3); playTone(100, 'sawtooth', 0.3, 0.4);} }
                if(obstacles.includes(c2) && !c2.isShield) { c2.hp--; if(c2.hp<=0) { obstacles = obstacles.filter(o=>o!==c2); createSparks(c2.x, c2.y, c2.color, 3); playTone(100, 'sawtooth', 0.3, 0.4);} }
            }
        }
    }

    // BRUTALIST DRAW FUNCTION
    function draw() {
        ctx.fillStyle = '#0A0A0A'; ctx.fillRect(0, 0, canvas.width, canvas.height); // Temizle
        
        ctx.save();
        if (shakeTime > 0) { ctx.translate((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12); shakeTime--; }

        // --- ARKA PLAN (Sert & Net Temalar) ---
        if (currentTheme === 'hazard') {
            ctx.fillStyle = '#1A1A1A'; ctx.fillRect(0,0, canvas.width, canvas.height);
            // Kenar şeritleri (Sarı / Siyah)
            ctx.fillStyle = '#FFD600';
            for(let i=-100; i<Math.max(canvas.width, canvas.height)+100; i+=40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i+20, 0); ctx.lineTo(0, i+20); ctx.lineTo(0, i); ctx.fill();
                ctx.beginPath(); ctx.moveTo(canvas.width, i); ctx.lineTo(canvas.width, i+20); ctx.lineTo(canvas.width-i-20, canvas.height); ctx.lineTo(canvas.width-i, canvas.height); ctx.fill();
            }
            ctx.fillStyle = '#0A0A0A'; ctx.fillRect(20, 20, canvas.width-40, canvas.height-40);
        } 
        else if (currentTheme === 'blueprint') {
            ctx.fillStyle = '#002B7F'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#4DA6FF'; ctx.lineWidth = 1;
            for(let x=20; x<canvas.width; x+=40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
            for(let y=20; y<canvas.height; y+=40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }
            // Thick borders
            ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 4; ctx.strokeRect(10, 10, canvas.width-20, canvas.height-20);
        } 
        else if (currentTheme === 'terminal') {
            ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#00FF00'; ctx.lineWidth = 2;
            let scanline = (frameCount * 3) % canvas.height;
            ctx.beginPath(); ctx.moveTo(0, scanline); ctx.lineTo(canvas.width, scanline); ctx.stroke();
            // Data text noise
            ctx.fillStyle = 'rgba(0, 255, 0, 0.2)'; ctx.font = '10px monospace';
            if(frameCount % 10 === 0) ctx.fillText("SYS.RDY " + Math.random().toString(36).substring(7), Math.random()*canvas.width, Math.random()*canvas.height);
        }
        else if (currentTheme === 'minimal') {
            ctx.fillStyle = '#F4F4F0'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#0A0A0A'; ctx.lineWidth = 4;
            ctx.strokeRect(20, 20, canvas.width-40, canvas.height-40);
        }

        let isDarkTheme = (currentTheme !== 'minimal');
        let lineColor = isDarkTheme ? '#F4F4F0' : '#0A0A0A';

        // Ortak Saha Çizgileri
        ctx.strokeStyle = lineColor; ctx.lineWidth = 4;
        ctx.setLineDash([15, 15]);
        ctx.beginPath(); ctx.moveTo(0, canvas.height/2); ctx.lineTo(canvas.width, canvas.height/2); ctx.stroke();
        ctx.setLineDash([]);
        
        ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height/2, 60, 0, Math.PI * 2); ctx.stroke();
        
        // Kale Alanı Çizgileri
        ctx.strokeRect(goalX - 20, 0, goalWidth + 40, 60);
        ctx.strokeRect(goalX - 20, canvas.height - 60, goalWidth + 40, 60);

        // Kaleler
        ctx.fillStyle = '#FF1010'; ctx.fillRect(goalX, canvas.height - 10, goalWidth, 10);
        ctx.fillStyle = '#1030FF'; ctx.fillRect(goalX, 0, goalWidth, 10);
        ctx.strokeStyle = '#0A0A0A'; ctx.lineWidth = 4;
        ctx.strokeRect(goalX, canvas.height - 10, goalWidth, 10);
        ctx.strokeRect(goalX, 0, goalWidth, 10);

        // Portallar (Square warning blocks)
        portals.forEach(p => {
            ctx.save(); ctx.translate(p.x, p.y);
            let s = p.r * 1.5;
            ctx.fillStyle = p.color; ctx.fillRect(-s/2, -s/2, s, s);
            ctx.lineWidth = 4; ctx.strokeStyle = '#0A0A0A'; ctx.strokeRect(-s/2, -s/2, s, s);
            ctx.fillStyle = '#0A0A0A'; 
            if(frameCount % 20 < 10) { ctx.fillRect(-s/4, -s/4, s/2, s/2); } // Yanıp sönme
            ctx.restore();
        });

        // Karadelikler (Jagged polygons)
        blackHoles.forEach(bh => {
            ctx.save(); ctx.translate(bh.x, bh.y); ctx.rotate(frameCount*0.05);
            ctx.fillStyle = '#0A0A0A'; ctx.strokeStyle = '#A200FF'; ctx.lineWidth = 4;
            ctx.beginPath();
            for(let i=0; i<8; i++) {
                let r = bh.r + (i%2 === 0 ? 10 : -10);
                let a = (i/8) * Math.PI * 2;
                ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
            }
            ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.restore();
        });

        // Güçlendirmeler (Solid Square Block)
        powerUps.forEach(pu => {
            pu.rot += 0.05;
            ctx.save(); ctx.translate(pu.x, pu.y); ctx.rotate(Math.sin(pu.rot)*0.3); // Hafif sallanma
            let s = pu.r * 1.5;
            // Brutalist shadow box
            ctx.fillStyle = '#0A0A0A'; ctx.fillRect(-s/2 + 4, -s/2 + 4, s, s);
            ctx.fillStyle = pu.color; ctx.fillRect(-s/2, -s/2, s, s);
            ctx.strokeStyle = '#0A0A0A'; ctx.lineWidth = 3; ctx.strokeRect(-s/2, -s/2, s, s);
            
            ctx.fillStyle = '#0A0A0A'; ctx.font = 'bold 20px "Space Mono"'; ctx.textAlign = 'center'; ctx.textBaseline='middle'; 
            ctx.fillText(pu.type, 0, 2);
            ctx.restore();
        });

        // Engeller (Octagons veya Blocky Shapes)
        obstacles.forEach(obs => {
            ctx.save(); ctx.translate(obs.x, obs.y);
            if(!obs.isShield) {
                ctx.fillStyle = obs.color; ctx.strokeStyle = '#0A0A0A'; ctx.lineWidth = 4;
                ctx.fillRect(-obs.r, -obs.r, obs.r*2, obs.r*2);
                ctx.strokeRect(-obs.r, -obs.r, obs.r*2, obs.r*2);
                ctx.fillStyle = '#0A0A0A'; ctx.font = 'bold 20px "Bebas Neue"'; ctx.textAlign = 'center'; ctx.textBaseline='middle'; 
                ctx.fillText(obs.hp, 0, 2);
            } else { // Kalkan
                ctx.fillStyle = obs.color; ctx.fillRect(-obs.r, -10, obs.r*2, 20);
                ctx.strokeStyle = '#0A0A0A'; ctx.lineWidth = 4; ctx.strokeRect(-obs.r, -10, obs.r*2, 20);
                // Uyarı şeritleri üstüne çiz
                ctx.fillStyle = '#0A0A0A';
                for(let i=-obs.r; i<obs.r; i+=15) { ctx.fillRect(i, -10, 5, 20); }
            }
            ctx.restore();
        });

        // Kuyruk Efekti (Retro Squares)
        trails.forEach(t => {
            ctx.fillStyle = t.color; 
            ctx.fillRect(t.x - t.size/2, t.y - t.size/2, t.size, t.size);
            ctx.strokeStyle = '#0A0A0A'; ctx.lineWidth = 2;
            ctx.strokeRect(t.x - t.size/2, t.y - t.size/2, t.size, t.size);
        });

        particles.forEach(p => p.draw());

        // Top(lar) - Sharp, High Contrast
        balls.forEach(ball => {
            ctx.fillStyle = ball.color; 
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
            ctx.lineWidth = 4; ctx.strokeStyle = '#0A0A0A'; ctx.stroke();
            // Inner Cross
            ctx.beginPath(); ctx.moveTo(ball.x - ball.r + 4, ball.y); ctx.lineTo(ball.x + ball.r - 4, ball.y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(ball.x, ball.y - ball.r + 4); ctx.lineTo(ball.x, ball.y + ball.r - 4); ctx.stroke();
        });

        // Oyuncular (Mecha Strikers)
        strikers.forEach(obj => {
            ctx.save();
            
            // Aktif oyuncu kare hedef (Targeting UI)
            if (obj.id === currentPlayer && gameState === 'waiting') {
                let ts = obj.r + 15;
                ctx.strokeStyle = obj.color; ctx.lineWidth = 4;
                // Köşe işaretleri
                ctx.beginPath(); ctx.moveTo(obj.x-ts, obj.y-ts+10); ctx.lineTo(obj.x-ts, obj.y-ts); ctx.lineTo(obj.x-ts+10, obj.y-ts); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(obj.x+ts, obj.y-ts+10); ctx.lineTo(obj.x+ts, obj.y-ts); ctx.lineTo(obj.x+ts-10, obj.y-ts); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(obj.x-ts, obj.y+ts-10); ctx.lineTo(obj.x-ts, obj.y+ts); ctx.lineTo(obj.x-ts+10, obj.y+ts); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(obj.x+ts, obj.y+ts-10); ctx.lineTo(obj.x+ts, obj.y+ts); ctx.lineTo(obj.x+ts-10, obj.y+ts); ctx.stroke();
            }

            // Stamina Bar (Yan tarafa yerleştirilmiş düz blok)
            if(cfg.useStamina) {
                let barW = 6; let barH = obj.r * 2;
                let sx = obj.x + obj.r + 8; let sy = obj.y - obj.r;
                ctx.fillStyle = '#0A0A0A'; ctx.fillRect(sx, sy, barW, barH);
                ctx.fillStyle = obj.stamina > 25 ? '#FFD600' : '#FF1010';
                let fillH = barH * (obj.stamina/100);
                ctx.fillRect(sx+1, sy + (barH - fillH) + 1, barW-2, fillH-2);
            }

            // Gölge Drop Shadow
            ctx.fillStyle = '#0A0A0A'; ctx.beginPath(); ctx.arc(obj.x + 4, obj.y + 4, obj.r, 0, Math.PI*2); ctx.fill();

            // Ana Gövde
            ctx.fillStyle = obj.color; ctx.beginPath(); ctx.arc(obj.x, obj.y, obj.r, 0, Math.PI*2); ctx.fill();
            ctx.lineWidth = 4; ctx.strokeStyle = '#0A0A0A'; ctx.stroke();
            
            // Üzerindeki Teknolojik Detaylar (Kareler, Çizgiler)
            ctx.fillStyle = '#0A0A0A'; 
            ctx.fillRect(obj.x - obj.r/2, obj.y - 3, obj.r, 6);
            ctx.fillRect(obj.x - 3, obj.y - obj.r/2, 6, obj.r);
            ctx.fillStyle = '#F4F4F0'; 
            ctx.fillRect(obj.x - 4, obj.y - 4, 8, 8);
            
            ctx.restore();
        });

        // Nişan Hattı (Lazer Hedefleme YERİNE Teknik Kesikli Çizgi)
        if (gameState === 'dragging' && selectedStriker) {
            let dx = dragStart.x - dragCurrent.x; let dy = dragStart.y - dragCurrent.y;
            let dist = Math.hypot(dx, dy); let maxP = 150; if (dist > maxP) { dx = (dx/dist)*maxP; dy = (dy/dist)*maxP; dist = maxP; }
            
            ctx.save();
            ctx.strokeStyle = selectedStriker.color; ctx.lineWidth = 6;
            ctx.setLineDash([10, 5]); 
            ctx.lineDashOffset = -frameCount; // Hareket eden şerit
            ctx.beginPath(); ctx.moveTo(selectedStriker.x, selectedStriker.y);
            ctx.lineTo(selectedStriker.x + dx, selectedStriker.y + dy); ctx.stroke();
            
            // Uçtaki Hedef Çaprazı
            ctx.setLineDash([]); ctx.lineWidth = 4; ctx.strokeStyle = '#0A0A0A';
            let tx = selectedStriker.x + dx; let ty = selectedStriker.y + dy;
            ctx.beginPath(); ctx.moveTo(tx - 10, ty - 10); ctx.lineTo(tx + 10, ty + 10); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(tx + 10, ty - 10); ctx.lineTo(tx - 10, ty + 10); ctx.stroke();
            // Renk dolgulu
            ctx.strokeStyle = '#FFD600'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(tx - 10, ty - 10); ctx.lineTo(tx + 10, ty + 10); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(tx + 10, ty - 10); ctx.lineTo(tx - 10, ty + 10); ctx.stroke();

            ctx.restore();
        }

        ctx.restore();
    }

    function handleGoal(pId) {
        if (pId === 1) score1++; else score2++;
        playTone(300, 'sawtooth', 0.5, 0.4); playTone(200, 'square', 0.5, 0.4); triggerShake(); triggerShake();
        
        const popup = document.getElementById("popup");
        if(wallCombo >= 3) { popup.innerText = `COMBO X${wallCombo}`; popup.style.color = 'var(--c-white)'; popup.style.background = 'var(--c-blue)'; }
        else { popup.innerText = "IMPACT!"; popup.style.color = 'var(--c-yellow)'; popup.style.background = 'var(--c-black)'; }
        
        popup.classList.remove('show');
        void popup.offsetWidth; 
        popup.classList.add('show');
        
        gameState = 'waiting'; updateUI();
        setTimeout(() => {
            if (score1 >= cfg.winScore || score2 >= cfg.winScore) {
                let winner = score1 >= cfg.winScore ? "P1 WINS" : (currentMode==='bot' ? "SYS C.P.U WINS" : "P2 WINS");
                document.getElementById('winner-text').innerText = winner;
                gameState = 'gameover'; showScreen('game-over-screen');
            } else { resetPositions(); }
        }, 1200);
    }

    function handleTimeOut() {
        gameState = 'gameover';
        let msg = "TIME OVER";
        if(score1 === score2) {
            msg = "SUDDEN DEATH!"; cfg.winScore = Math.max(score1, score2) + 1;
            gameState = 'waiting'; resetPositions(); 
            const popup = document.getElementById("popup");
            popup.innerText = "SUDDEN DEATH"; popup.style.color = 'var(--c-red)';
            popup.classList.remove('show'); void popup.offsetWidth; popup.classList.add('show');
            return;
        } else { msg = score1 > score2 ? "P1 WINS" : "P2 WINS"; }
        document.getElementById('winner-text').innerText = msg;
        showScreen('game-over-screen');
    }

    function resetPositions() {
        balls = [{ x: canvas.width/2, y: canvas.height/2, r: cfg.ballRadius, vx: 0, vy: 0, m: 1, color: '#F4F4F0' }];
        strikers[0].x = canvas.width/2; strikers[0].y = canvas.height - 120; strikers[0].vx = 0; strikers[0].vy = 0;
        strikers[1].x = canvas.width/2; strikers[1].y = 120; strikers[1].vx = 0; strikers[1].vy = 0;
        trails = []; powerUps = []; particles = []; wallCombo = 0; gameState = 'waiting'; timeScale = 1;
        if (currentMode === 'bot' && currentPlayer === 2) botTurn();
    }

    function updateUI() {
        document.getElementById('score1').innerText = score1; 
        document.getElementById('score2').innerText = score2;
    }

    function getEventPos(e) {
        let rect = canvas.getBoundingClientRect();
        let clientX = e.touches ? e.touches[0].clientX : e.clientX; 
        let clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: (clientX - rect.left) * (canvas.width / rect.width), y: (clientY - rect.top) * (canvas.height / rect.height) };
    }

    function startInteraction(e) {
        if (gameState !== 'waiting' || (currentMode === 'bot' && currentPlayer === 2)) return;
        e.preventDefault(); initAudio();
        let pos = getEventPos(e);
        let activeS = strikers.find(s => s.id === currentPlayer);
        
        if (Math.hypot(activeS.x - pos.x, activeS.y - pos.y) < activeS.r * 4) { // Daha geniş dokunma alanı
            if(cfg.useStamina && activeS.stamina < 20) { playTone(150, 'sawtooth', 0.1, 0.1); return; } // Hata sesi
            selectedStriker = activeS; dragStart = pos; dragCurrent = pos; gameState = 'dragging';
        }
    }

    function moveInteraction(e) {
        if (gameState !== 'dragging' || !selectedStriker) return;
        e.preventDefault(); dragCurrent = getEventPos(e);
    }

    function endInteraction(e) {
        if (gameState !== 'dragging' || !selectedStriker) return;
        if(e && e.preventDefault) e.preventDefault();
        
        let dx = dragStart.x - dragCurrent.x; let dy = dragStart.y - dragCurrent.y;
        let dist = Math.hypot(dx, dy); let maxP = 150; 
        if (dist > maxP) { dx = (dx/dist)*maxP; dy = (dy/dist)*maxP; }
        
        selectedStriker.vx = dx * 1.15; selectedStriker.vy = dy * 1.15;
        
        if (Math.hypot(selectedStriker.vx, selectedStriker.vy) > 2) {
            if(cfg.useStamina) selectedStriker.stamina -= 25; 
            gameState = 'moving';
            playTone(100, 'square', 0.1, 0.3); // Fırlatma Sesi
        } else { gameState = 'waiting'; }
        selectedStriker = null;
    }

    canvas.addEventListener('mousedown', startInteraction); canvas.addEventListener('mousemove', moveInteraction); window.addEventListener('mouseup', endInteraction);
    canvas.addEventListener('touchstart', startInteraction, {passive: false}); canvas.addEventListener('touchmove', moveInteraction, {passive: false}); window.addEventListener('touchend', endInteraction);

    function gameLoop() {
        if(gameState !== 'gameover') { update(); draw(); }
        gameLoopId = requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
