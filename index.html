<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MECHA STRIKE // RAW EDITION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;700;900&family=Orbitron:wght@500;700;900&family=Press+Start+2P&family=Cinzel:wght@700;900&family=VT323&family=Rajdhani:wght@600;700&family=Share+Tech+Mono&family=Black+Ops+One&display=swap');

        /* ----------------------------------------------------
           TEMEL DEĞİŞKENLER (VARSAYILAN RAW EDITION RENKLERİ)
           ---------------------------------------------------- */
        :root {
            --c-red: #FF1010;
            --c-blue: #1030FF;
            --c-yellow: #FFD600;
            --c-black: #0A0A0A;
            --c-white: #F4F4F0;
            
            --border-thick: 4px solid var(--c-black);
            --shadow-brutal: 6px 6px 0px var(--c-black);
            --f-head: 'Bebas Neue', sans-serif;
            --f-body: 'Space Mono', monospace;
            --ui-rad: 0px;
            --bg-pattern: repeating-linear-gradient( 45deg, #111, #111 20px, #1a1a1a 20px, #1a1a1a 40px );
        }

        /* ----------------------------------------------------
           20 FARKLI RENK PALETİ (COLOR STUDIO)
           ---------------------------------------------------- */
        body[data-color="raw"] { --c-red: #FF1010; --c-blue: #1030FF; --c-yellow: #FFD600; --c-black: #0A0A0A; --c-white: #F4F4F0; }
        body[data-color="hacker"] { --c-red: #00FF41; --c-blue: #008F11; --c-yellow: #00FF41; --c-black: #051005; --c-white: #0D0208; --border-thick: 2px solid var(--c-red); }
        body[data-color="synthwave"] { --c-red: #FF007F; --c-blue: #00F0FF; --c-yellow: #FFE600; --c-black: #1A0B2E; --c-white: #2D1B4E; }
        body[data-color="cyberpunk"] { --c-red: #FF003C; --c-blue: #04D9FF; --c-yellow: #F3E600; --c-black: #111111; --c-white: #2B2B2B; }
        body[data-color="monochrome"] { --c-red: #FFFFFF; --c-blue: #AAAAAA; --c-yellow: #CCCCCC; --c-black: #050505; --c-white: #111111; }
        body[data-color="vaporwave"] { --c-red: #FF71CE; --c-blue: #01CDFE; --c-yellow: #05FFA1; --c-black: #2C2C54; --c-white: #FFFBB5; }
        body[data-color="bloodmoon"] { --c-red: #DC143C; --c-blue: #8B0000; --c-yellow: #FF0000; --c-black: #050000; --c-white: #110000; }
        body[data-color="toxic"] { --c-red: #FF4500; --c-blue: #32CD32; --c-yellow: #ADFF2F; --c-black: #0A0A0A; --c-white: #141414; }
        body[data-color="oceanic"] { --c-red: #00FFFF; --c-blue: #1E90FF; --c-yellow: #00CED1; --c-black: #000022; --c-white: #E0FFFF; }
        body[data-color="royal"] { --c-red: #800020; --c-blue: #002366; --c-yellow: #D4AF37; --c-black: #0A0A0A; --c-white: #1A1A1A; }
        body[data-color="pastel"] { --c-red: #FFB3BA; --c-blue: #BAE1FF; --c-yellow: #FFFFBA; --c-black: #4A4A4A; --c-white: #FFF5F5; }
        body[data-color="void"] { --c-red: #FF00FF; --c-blue: #00FFFF; --c-yellow: #00FF00; --c-black: #000000; --c-white: #111111; }
        body[data-color="sunset"] { --c-red: #FF4E50; --c-blue: #F9D423; --c-yellow: #FF8E53; --c-black: #2C0707; --c-white: #4A1515; }
        body[data-color="forest"] { --c-red: #A8E6CF; --c-blue: #3B82F6; --c-yellow: #DCEDC1; --c-black: #1E293B; --c-white: #0F172A; }
        body[data-color="ice"] { --c-red: #A0E8AF; --c-blue: #88CCF1; --c-yellow: #C1DFF0; --c-black: #00171F; --c-white: #003459; }
        body[data-color="rust"] { --c-red: #B33939; --c-blue: #227093; --c-yellow: #CC8E35; --c-black: #211E1E; --c-white: #2C2C2C; }
        body[data-color="candy"] { --c-red: #FF1493; --c-blue: #00BFFF; --c-yellow: #FFD700; --c-black: #191970; --c-white: #FFC0CB; }
        body[data-color="midnight"] { --c-red: #8A2BE2; --c-blue: #4169E1; --c-yellow: #9370DB; --c-black: #0B0B1A; --c-white: #1A1A3A; }
        body[data-color="desert"] { --c-red: #E07A5F; --c-blue: #3D405B; --c-yellow: #F2CC8F; --c-black: #2E282A; --c-white: #F4F1DE; }
        body[data-color="ghost"] { --c-red: #E2E8F0; --c-blue: #94A3B8; --c-yellow: #CBD5E1; --c-black: #0F172A; --c-white: #1E293B; }

        /* ----------------------------------------------------
           18 FARKLI TASARIM DESENİ (SHAPE STUDIO)
           ---------------------------------------------------- */
        body[data-design="brutal"] { --f-head: 'Bebas Neue'; --f-body: 'Space Mono'; --ui-rad: 0px; --bg-pattern: repeating-linear-gradient( 45deg, var(--c-black), var(--c-black) 20px, var(--c-white) 20px, var(--c-white) 40px ); }
        body[data-design="glass"] { --f-head: 'Inter'; --f-body: 'Inter'; --ui-rad: 30px; --bg-pattern: radial-gradient(circle at center, var(--c-white), var(--c-black)); }
        body[data-design="cyber"] { --f-head: 'Orbitron'; --f-body: 'Orbitron'; --ui-rad: 0px; --bg-pattern: linear-gradient(var(--c-black) 2px, transparent 2px), linear-gradient(90deg, var(--c-black) 2px, transparent 2px); }
        body[data-design="pixel"] { --f-head: 'Press Start 2P'; --f-body: 'Press Start 2P'; --ui-rad: 0px; --bg-pattern: radial-gradient(var(--c-yellow) 2px, transparent 2px); }
        body[data-design="arcade"] { --f-head: 'Bebas Neue'; --f-body: 'Space Mono'; --ui-rad: 10px; --bg-pattern: repeating-linear-gradient(0deg, var(--c-black), var(--c-black) 10px, var(--c-white) 10px, var(--c-white) 20px); }
        body[data-design="minimal"] { --f-head: 'Inter'; --f-body: 'Inter'; --ui-rad: 0px; --bg-pattern: none; }
        body[data-design="tactical"] { --f-head: 'Black Ops One'; --f-body: 'Share Tech Mono'; --ui-rad: 4px; --bg-pattern: repeating-linear-gradient(-45deg, var(--c-black), var(--c-black) 15px, var(--c-white) 15px, var(--c-white) 30px); }
        body[data-design="luxury"] { --f-head: 'Cinzel'; --f-body: 'Inter'; --ui-rad: 2px; --bg-pattern: radial-gradient(circle, var(--c-white) 0%, var(--c-black) 100%); }
        body[data-design="chalk"] { --f-head: 'Space Mono'; --f-body: 'Space Mono'; --ui-rad: 10px; --bg-pattern: repeating-radial-gradient(circle at center, var(--c-black), var(--c-black) 5px, var(--c-white) 5px, var(--c-white) 10px); }
        body[data-design="vaporwave"] { --f-head: 'Orbitron'; --f-body: 'Inter'; --ui-rad: 0px; --bg-pattern: linear-gradient(var(--c-red) 1px, transparent 1px), linear-gradient(90deg, var(--c-blue) 1px, transparent 1px); }
        body[data-design="blood"] { --f-head: 'Cinzel'; --f-body: 'Space Mono'; --ui-rad: 0px; --bg-pattern: radial-gradient(circle, var(--c-white), var(--c-black)); }
        body[data-design="toxic"] { --f-head: 'Bebas Neue'; --f-body: 'Space Mono'; --ui-rad: 8px; --bg-pattern: repeating-linear-gradient(45deg, var(--c-black), var(--c-black) 10px, var(--c-white) 10px, var(--c-white) 20px); }
        body[data-design="ocean"] { --f-head: 'Rajdhani'; --f-body: 'Inter'; --ui-rad: 50px; --bg-pattern: radial-gradient(ellipse at center, var(--c-white), var(--c-black)); }
        body[data-design="comic"] { --f-head: 'Bebas Neue'; --f-body: 'Space Mono'; --ui-rad: 25px 5px 25px 5px; --bg-pattern: radial-gradient(var(--c-black) 15%, transparent 16%); }
        body[data-design="terminal"] { --f-head: 'VT323'; --f-body: 'VT323'; --ui-rad: 0px; --bg-pattern: linear-gradient(var(--c-white) 50%, transparent 50%); }
        body[data-design="industrial"] { --f-head: 'Share Tech Mono'; --f-body: 'Space Mono'; --ui-rad: 2px; --bg-pattern: linear-gradient(135deg, var(--c-white) 25%, transparent 25%), linear-gradient(225deg, var(--c-white) 25%, transparent 25%); }
        body[data-design="pill"] { --f-head: 'Rajdhani'; --f-body: 'Rajdhani'; --ui-rad: 50px; --bg-pattern: repeating-linear-gradient(135deg, var(--c-black), var(--c-black) 25px, var(--c-white) 25px, var(--c-white) 50px); }
        body[data-design="void"] { --f-head: 'Orbitron'; --f-body: 'Inter'; --ui-rad: 15px; --bg-pattern: radial-gradient(circle at center, var(--c-black) 0%, var(--c-white) 100%); }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--c-black);
            font-family: var(--f-body); color: var(--c-black);
            overflow: hidden; user-select: none; touch-action: none; transition: 0.3s;
        }

        .bg-stripes {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            background: var(--bg-pattern); opacity: 0.2; pointer-events: none; transition: 0.3s;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; opacity: 1; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .hidden { transform: translateY(-120%); pointer-events: none; }

        /* BRUTALIST BOX CONTAINER (ORİJİNAL GÖRÜNÜM) */
        .brutal-box {
            background: var(--c-white); border: var(--border-thick); border-radius: var(--ui-rad);
            box-shadow: 12px 12px 0px var(--c-yellow); padding: 40px 30px;
            display: flex; flex-direction: column; align-items: center;
            position: relative; max-width: 90%; width: 560px; max-height: 92vh; transition: 0.3s;
        }
        
        .brutal-box::before {
            content: 'SYS.V.3.0'; position: absolute; top: -15px; left: 20px;
            background: var(--c-yellow); border: var(--border-thick); border-radius: var(--ui-rad);
            padding: 2px 10px; font-weight: bold; font-size: 14px; font-family: var(--f-body);
        }

        h1 {
            font-family: var(--f-head); font-size: 55px; margin: 0 0 25px 0;
            text-transform: uppercase; line-height: 0.9; text-align: center;
            letter-spacing: 2px; color: var(--c-black);
            text-shadow: 4px 4px 0px var(--c-red); transition: 0.3s;
        }
        h1 span {
            display: block; font-size: 22px; letter-spacing: 5px;
            background: var(--c-black); color: var(--c-yellow); border-radius: var(--ui-rad);
            padding: 5px; margin-top: 10px; text-shadow: none;
        }

        /* BRUTALIST BUTTONS */
        .btn {
            background: var(--c-white); border: var(--border-thick); border-radius: var(--ui-rad); color: var(--c-black);
            padding: 15px 30px; font-size: 22px; font-family: var(--f-head);
            letter-spacing: 2px; margin: 8px 0; cursor: pointer;
            width: 100%; text-align: center; position: relative;
            box-shadow: var(--shadow-brutal); transition: all 0.1s;
            text-transform: uppercase;
        }
        .btn:active { box-shadow: 0px 0px 0px var(--c-black); transform: translate(6px, 6px); }
        
        .btn-red { background: var(--c-red); color: white; }
        .btn-blue { background: var(--c-blue); color: white; }
        .btn-yellow { background: var(--c-yellow); color: var(--c-black); }

        /* SCROLL GRIDS */
        .settings-grid, .design-grid, .color-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
            width: 100%; max-height: 50vh; overflow-y: auto;
            margin-bottom: 20px; padding-right: 10px;
        }
        .settings-grid::-webkit-scrollbar, .design-grid::-webkit-scrollbar, .color-grid::-webkit-scrollbar { width: 10px; border-left: 2px solid var(--c-black); }
        .settings-grid::-webkit-scrollbar-track, .design-grid::-webkit-scrollbar-track, .color-grid::-webkit-scrollbar-track { background: var(--c-white); }
        .settings-grid::-webkit-scrollbar-thumb, .design-grid::-webkit-scrollbar-thumb, .color-grid::-webkit-scrollbar-thumb { background: var(--c-black); }

        .setting-item {
            background: rgba(0,0,0,0.05); border: 2px solid var(--c-black); padding: 8px; border-radius: var(--ui-rad);
            display: flex; flex-direction: column; justify-content: center;
        }
        .setting-item label { font-size: 11px; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; font-family: var(--f-body); }
        .setting-item select, .setting-item input[type="number"] {
            background: var(--c-white); border: 2px solid var(--c-black); border-radius: var(--ui-rad);
            font-family: var(--f-body); font-size: 14px; font-weight: bold;
            padding: 5px; cursor: pointer; color: var(--c-black);
        }
        .setting-item input[type="range"] { -webkit-appearance: none; width: 100%; background: transparent; }
        .setting-item input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 8px; background: var(--c-black); border: 1px solid var(--c-black); border-radius: var(--ui-rad); }
        .setting-item input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 14px; background: var(--c-yellow); border: 2px solid var(--c-black); margin-top: -6px; cursor: pointer; border-radius: var(--ui-rad); }

        /* PREVIEW CARDS (DESIGN & COLOR STUDIO) */
        .preview-card {
            background: var(--c-white); border: 2px solid var(--c-black); border-radius: var(--ui-rad);
            padding: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px;
            box-shadow: 4px 4px 0px var(--c-black); transition: 0.1s; color: var(--c-black); font-family: var(--f-body);
        }
        .preview-card:hover { transform: translateY(-2px); }
        .preview-card.selected { background: var(--c-yellow); border-color: var(--c-black); outline: 2px solid var(--c-black); }
        .preview-card h3 { font-family: var(--f-head); margin: 0; font-size: 16px; text-align: center; text-transform: uppercase; }
        
        .mini-preview { width: 100%; height: 35px; border: 2px solid var(--c-black); display: flex; align-items: center; justify-content: space-around; border-radius: inherit; background: var(--c-black); }
        .mini-color-swatch { display: flex; width: 100%; height: 30px; border: 2px solid var(--c-black); border-radius: inherit; overflow: hidden; }
        .swatch-c { flex: 1; height: 100%; }

        .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-bottom: 20px; }
        .field-option {
            background: var(--c-white); border: var(--border-thick); padding: 15px 5px; border-radius: var(--ui-rad);
            cursor: pointer; text-align: center; font-family: var(--f-head);
            font-size: 20px; transition: 0.1s; box-shadow: 4px 4px 0px var(--c-black);
        }
        .field-option:active { box-shadow: 0px 0px 0px var(--c-black); transform: translate(4px, 4px); }
        .field-option.selected { background: var(--c-yellow); color: var(--c-black); }

        /* LIVE PREVIEW WIDGET (SAĞ ÜST KÖŞE) */
        #live-widget {
            position: fixed; top: 15px; right: 15px; z-index: 100;
            background: var(--c-white); border: var(--border-thick); border-radius: var(--ui-rad);
            padding: 5px 10px; display: flex; flex-direction: column; align-items: center; gap: 5px;
            box-shadow: 4px 4px 0px var(--c-yellow); font-family: var(--f-head); font-size: 14px; color: var(--c-black); pointer-events: none;
        }
        #widget-shape { width: 20px; height: 20px; background: var(--c-red); border: 2px solid var(--c-black); }
        #widget-color-bar { width: 100%; height: 6px; display: flex; }

        /* GAME UI */
        #game-container { display: none; width: 100%; height: 100%; position: relative; background: var(--c-black); }
        #canvas-wrapper { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
        
        #hud { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); display: flex; justify-content: space-between; align-items: center; width: 95%; max-width: 600px; z-index: 20; pointer-events: none; }
        .score-block { background: var(--c-white); border: var(--border-thick); border-radius: var(--ui-rad); padding: 5px 15px; display: flex; align-items: center; gap: 10px; font-family: var(--f-head); font-size: 30px; box-shadow: 4px 4px 0px var(--c-black); }
        .p1-score { color: var(--c-red); } .p2-score { color: var(--c-blue); }
        .score-block span { background: var(--c-black); color: white; padding: 2px 12px; font-size: 35px; border-radius: var(--ui-rad); }
        #timer-box { background: var(--c-yellow); border: var(--border-thick); border-radius: var(--ui-rad); color: var(--c-black); font-family: var(--f-body); font-size: 20px; font-weight: bold; padding: 8px 15px; box-shadow: 4px 4px 0px var(--c-black); }
        .popup-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); background: var(--c-black); border: var(--border-thick); border-radius: var(--ui-rad); color: var(--c-yellow); font-family: var(--f-head); font-size: 80px; padding: 20px 40px; text-align: center; pointer-events: none; opacity: 0; z-index: 50; box-shadow: 15px 15px 0px var(--c-red); }
        .popup-text.show { animation: stampAnim 1.2s cubic-bezier(0.2, 1.4, 0.4, 1) forwards; }
        @keyframes stampAnim { 0% { transform: translate(-50%, -50%) scale(2); opacity: 0; } 30%, 70% { transform: translate(-50%, -50%) scale(1) rotate(-5deg); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(0); opacity: 0; } }

        @media (max-width: 600px) {
            h1 { font-size: 45px; } h1 span { font-size: 16px; }
            .brutal-box { padding: 25px 15px; width: 95%; }
            .settings-grid, .design-grid, .color-grid { grid-template-columns: 1fr; max-height: 55vh; }
            .score-block { font-size: 20px; padding: 5px 10px; } .score-block span { font-size: 24px; padding: 2px 8px; }
            #timer-box { font-size: 16px; padding: 5px 10px; }
            .popup-text { font-size: 50px; padding: 10px 20px; box-shadow: 8px 8px 0px var(--c-red); }
            #live-widget { display: none; } /* Mobilde gizle */
        }
    </style>
</head>
<body data-color="raw" data-design="brutal">

<div id="live-widget">
    <div id="widget-shape" style="border-radius: var(--ui-rad)"></div>
    <div id="widget-color-bar">
        <div class="swatch-c" style="background: var(--c-red)"></div>
        <div class="swatch-c" style="background: var(--c-blue)"></div>
        <div class="swatch-c" style="background: var(--c-yellow)"></div>
    </div>
</div>

<div class="bg-stripes" id="bg-anim"></div>

<!-- MAIN MENU -->
<div id="main-menu" class="screen">
    <div class="brutal-box">
        <h1>MECHA STRIKE<br><span data-i18n="raw_edition">// RAW EDITION</span></h1>
        <button class="btn btn-red" onclick="startGame('1v1')" data-i18n="play_1v1">[ PLAY : 1 V 1 ]</button>
        <button class="btn btn-blue" onclick="startGame('bot')" data-i18n="play_cpu">[ PLAY : VS C.P.U ]</button>
        <button class="btn btn-yellow" onclick="showScreen('field-menu')" data-i18n="btn_env">ENVIRONMENT</button>
        <button class="btn" onclick="showScreen('design-menu')" data-i18n="btn_design">DESIGN & COLOR STUDIO</button>
        <button class="btn" onclick="showScreen('settings-menu')" data-i18n="btn_sys">SYSTEM CONFIG</button>
    </div>
</div>

<!-- DESIGN & COLOR STUDIO -->
<div id="design-menu" class="screen hidden">
    <div class="brutal-box" style="width: 700px;">
        <div style="display:flex; width:100%; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <button class="btn" id="tab-design" onclick="switchTab('design')" style="margin:0; width:48%; background:var(--c-yellow);" data-i18n="tab_shapes">SHAPES</button>
            <button class="btn" id="tab-color" onclick="switchTab('color')" style="margin:0; width:48%;" data-i18n="tab_colors">COLORS</button>
        </div>
        
        <div class="design-grid" id="design-grid-container"></div>
        <div class="color-grid" id="color-grid-container" style="display:none;"></div>
        
        <button class="btn btn-red" onclick="showScreen('main-menu')" data-i18n="btn_save">SAVE & EXIT</button>
    </div>
</div>

<!-- ENVIRONMENT SELECTION -->
<div id="field-menu" class="screen hidden">
    <div class="brutal-box" style="width: 600px;">
        <h1 style="font-size: 35px; margin-bottom: 20px;" data-i18n="title_env">ENVIRONMENT MAP</h1>
        <div class="field-grid">
            <div class="field-option selected" id="f-hazard" onclick="selectField('hazard')">HAZARD ZONE</div>
            <div class="field-option" id="f-blueprint" onclick="selectField('blueprint')">BLUEPRINT</div>
            <div class="field-option" id="f-terminal" onclick="selectField('terminal')">TERMINAL CRT</div>
            <div class="field-option" id="f-minimal" onclick="selectField('minimal')">STRICT MINIMAL</div>
        </div>
        <button class="btn btn-red" onclick="showScreen('main-menu')" data-i18n="btn_save">SAVE & EXIT</button>
    </div>
</div>

<!-- SETTINGS MENU -->
<div id="settings-menu" class="screen hidden">
    <div class="brutal-box" style="max-width: 800px; width: 95%;">
        <h1 style="font-size: 35px; margin-bottom: 20px;" data-i18n="title_sys">SYSTEM CONFIGURATION</h1>
        <div class="settings-grid">
            <div class="setting-item"><label data-i18n="lbl_lang">Language</label>
                <select id="cfg-lang" onchange="changeLang(this.value)">
                    <option value="en">English</option><option value="tr">Türkçe</option>
                    <option value="ja">日本語 (Japanese)</option><option value="ko">한국어 (Korean)</option>
                    <option value="zh">中文 (Chinese)</option><option value="de">Deutsch (German)</option>
                    <option value="fr">Français (French)</option><option value="es">Español (Spanish)</option>
                    <option value="it">Italiano (Italian)</option><option value="pt">Português (Portuguese)</option>
                    <option value="ru">Русский (Russian)</option><option value="ar">العربية (Arabic)</option>

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    let audioCtx = null;
    function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function playTone(f, t, d, v=0.1) { if(!audioCtx) return; let o=audioCtx.createOscillator(); let g=audioCtx.createGain(); o.type=t; o.frequency.setValueAtTime(f,audioCtx.currentTime); g.gain.setValueAtTime(v,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+d); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+d); }

    let cfg = { winScore: 5, timeLimit: 9999, gravity: 0, ballRadius: 14, elasticity: 1.1, usePortals: true, useBlackhole: false, useStamina: true, botStyle: 'balanced', maxSpeed: 30, strikerRad: 24, shake: true, useSlowMo: true, useObstacles: true };
    let score1=0, score2=0, currentPlayer=1, currentMode='1v1', gameState='waiting', gameLoopId, frameCount=0, matchTimer=0, matchSeconds=0, timeScale=1, currentTheme='hazard', shakeTime=0, wallCombo=0;
    let balls=[], strikers=[], goalPosts=[], obstacles=[], portals=[], blackHoles=[], powerUps=[], particles=[], trails=[];
    let goalWidth, goalX;
    let selectedStriker=null, dragStart={x:0,y:0}, dragCurrent={x:0,y:0};

    function resizeCanvas() { canvas.width=document.getElementById('canvas-wrapper').clientWidth; canvas.height=document.getElementById('canvas-wrapper').clientHeight; setupEnv(); }
    window.addEventListener('resize', () => { if(gameState!=='gameover' && document.getElementById('game-container').style.display==='block') resizeCanvas(); });

    function setupEnv() {
        goalWidth = Math.max(160, canvas.width * 0.35); if(goalWidth>280) goalWidth=280; goalX = (canvas.width-goalWidth)/2;
        goalPosts = [{x:goalX,y:-5,r:12,m:Infinity,isStatic:true}, {x:goalX+goalWidth,y:-5,r:12,m:Infinity,isStatic:true}, {x:goalX,y:canvas.height+5,r:12,m:Infinity,isStatic:true}, {x:goalX+goalWidth,y:canvas.height+5,r:12,m:Infinity,isStatic:true}];
        portals = cfg.usePortals ? [{x:canvas.width*0.15, y:canvas.height*0.5, r:28, tid:1}, {x:canvas.width*0.85, y:canvas.height*0.5, r:28, tid:0}] : [];
        blackHoles = cfg.useBlackhole ? [{x:canvas.width*0.5, y:canvas.height*0.33, r:35}, {x:canvas.width*0.5, y:canvas.height*0.67, r:35}] : [];
        obstacles = cfg.useObstacles ? [{x:canvas.width*0.25, y:canvas.height*0.25, r:22, m:Infinity, isStatic:true, dir:1, hp:5}, {x:canvas.width*0.75, y:canvas.height*0.75, r:22, m:Infinity, isStatic:true, dir:-1, hp:5}] : [];
    }

    class Spark {
        constructor(x,y,c,s=1) { this.x=x; this.y=y; this.c=c; let a=Math.random()*Math.PI*2; let sp=(Math.random()*10+4)*s; this.vx=Math.cos(a)*sp; this.vy=Math.sin(a)*sp; this.size=Math.random()*8+4; this.life=1; this.decay=Math.random()*0.05+0.02; this.rot=Math.random()*Math.PI; this.rs=(Math.random()-0.5)*0.4; }
        update() { this.x+=this.vx*timeScale; this.y+=this.vy*timeScale; this.vx*=0.9; this.vy*=0.9; this.rot+=this.rs; this.life-=this.decay*timeScale; }
        draw() { if(this.life<=0) return; ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.rot); let s=this.size*this.life; ctx.fillStyle=this.c; ctx.fillRect(-s/2,-s/2,s,s); ctx.lineWidth=2; ctx.strokeStyle=getCSSVar('--c-black'); ctx.strokeRect(-s/2,-s/2,s,s); ctx.restore(); }
    }
    function createSparks(x,y,c,s=1) { for(let i=0;i<15;i++) particles.push(new Spark(x,y,c,s)); }

    function showScreen(id) { document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden')); document.getElementById('game-container').style.display='none'; document.getElementById('bg-anim').style.display = id==='game'?'none':'block'; if(id==='game') { document.getElementById('game-container').style.display='block'; resizeCanvas(); } else document.getElementById(id).classList.remove('hidden'); }
    function selectField(id) { currentTheme=id; document.querySelectorAll('.field-option').forEach(e=>e.classList.remove('selected')); document.getElementById('f-'+id).classList.add('selected'); }

    function applySettings() {
        cfg.strikerRad=parseInt(document.getElementById('cfg-strikerrad').value); cfg.winScore=parseInt(document.getElementById('cfg-winscore').value);
        cfg.timeLimit=parseInt(document.getElementById('cfg-timelimit').value); cfg.gravity=parseFloat(document.getElementById('cfg-gravity').value);
        cfg.ballRadius=parseInt(document.getElementById('cfg-ballradius').value); cfg.elasticity=parseInt(document.getElementById('cfg-elasticity').value)/10;
        cfg.usePortals=document.getElementById('cfg-portals').value==='true'; cfg.useBlackhole=document.getElementById('cfg-blackhole').value==='true';
        cfg.useStamina=document.getElementById('cfg-stamina').value==='true'; cfg.botStyle=document.getElementById('cfg-botstyle').value;
        cfg.maxSpeed=parseInt(document.getElementById('cfg-speed').value); cfg.shake=document.getElementById('cfg-shake').value==='true';
        cfg.useSlowMo=document.getElementById('cfg-slowmo').value==='true'; cfg.useObstacles=document.getElementById('cfg-obstacles').value==='true';
        showScreen('main-menu');
    }

    function startGame(mode) { initAudio(); currentMode=mode; score1=0; score2=0; currentPlayer=1; matchSeconds=0; matchTimer=0; wallCombo=0; timeScale=1; balls=[]; powerUps=[]; particles=[]; trails=[]; strikers=[{id:1,x:0,y:0,r:cfg.strikerRad,vx:0,vy:0,m:14,stamina:100,isP1:true},{id:2,x:0,y:0,r:cfg.strikerRad,vx:0,vy:0,m:14,stamina:100,isP1:false}]; showScreen('game'); resetPositions(); updateUI(); if(gameLoopId) cancelAnimationFrame(gameLoopId); gameLoop(); }
    function triggerShake() { if(cfg.shake) shakeTime=10; }

    function getCSSVar(name) { return getComputedStyle(document.body).getPropertyValue(name).trim(); }

    function update() {
        frameCount++;
        if(gameState!=='gameover') { matchTimer++; if(matchTimer>=60) { matchTimer=0; matchSeconds++; let m=Math.floor(matchSeconds/60); let s=matchSeconds%60; document.getElementById('timer-box').innerText=(m<10?"0"+m:m)+":"+(s<10?"0"+s:s); if(matchSeconds>=cfg.timeLimit) handleTimeOut(); } }
        obstacles.forEach(o=>{ o.x+=o.dir*2*timeScale; if(o.x-o.r<40 || o.x+o.r>canvas.width-40) o.dir*=-1; });
        
        let near = false;
        if(cfg.useSlowMo) { balls.forEach(b=>{ if((b.y<90||b.y>canvas.height-90)&&b.x>goalX&&b.x<goalX+goalWidth) near=true; }); timeScale+=(near?-0.1:0.1); timeScale=Math.max(0.25,Math.min(1,timeScale)); } else timeScale=1;

        if(gameState==='moving') {
            let moving=false; let subs=5; let ents=[...balls,...strikers,...goalPosts,...obstacles];
            for(let step=0;step<subs;step++) {
                balls.forEach(b=>{
                    let spd=Math.hypot(b.vx,b.vy); if(step===0&&spd>4&&frameCount%2===0) { trails.push({x:b.x,y:b.y,size:b.r*1.2}); if(trails.length>15) trails.shift(); }
                    b.vy+=cfg.gravity/subs; b.x+=b.vx*timeScale/subs; b.y+=b.vy*timeScale/subs;
                    if(spd>cfg.maxSpeed) { b.vx=(b.vx/spd)*cfg.maxSpeed; b.vy=(b.vy/spd)*cfg.maxSpeed; }
                    b.vx*=Math.pow(0.99,timeScale/subs); b.vy*=Math.pow(0.99,timeScale/subs);
                    if(Math.abs(b.vx)>0.1||Math.abs(b.vy)>0.1) moving=true;
                    if(b.x-b.r<0){b.x=b.r;b.vx*=-0.9;wallCombo++;createSparks(0,b.y,getCSSVar('--c-white'));playTone(250,'square',0.05);}
                    if(b.x+b.r>canvas.width){b.x=canvas.width-b.r;b.vx*=-0.9;wallCombo++;createSparks(canvas.width,b.y,getCSSVar('--c-white'));playTone(250,'square',0.05);}
                    if(b.y-b.r<0){if(b.x>goalX&&b.x<goalX+goalWidth){handleGoal(1);return;}else{b.y=b.r;b.vy*=-0.9;wallCombo++;createSparks(b.x,0,getCSSVar('--c-white'));playTone(250,'square',0.05);}}
                    if(b.y+b.r>canvas.height){if(b.x>goalX&&b.x<goalX+goalWidth){handleGoal(2);return;}else{b.y=canvas.height-b.r;b.vy*=-0.9;wallCombo++;createSparks(b.x,canvas.height,getCSSVar('--c-white'));playTone(250,'square',0.05);}}
                });
                strikers.forEach(s=>{
                    s.x+=s.vx*timeScale/subs; s.y+=s.vy*timeScale/subs; s.vx*=Math.pow(0.82,timeScale/subs); s.vy*=Math.pow(0.82,timeScale/subs);
                    if(Math.abs(s.vx)>0.1||Math.abs(s.vy)>0.1) moving=true;
                    if(s.x-s.r<0){s.x=s.r;s.vx*=-0.5;} if(s.x+s.r>canvas.width){s.x=canvas.width-s.r;s.vx*=-0.5;}
                    if(s.y-s.r<0){s.y=s.r;s.vy*=-0.5;} if(s.y+s.r>canvas.height){s.y=canvas.height-s.r;s.vy*=-0.5;}
                    if(cfg.useStamina&&s.stamina<100) s.stamina+=0.12;
                });
                for(let i=0;i<ents.length;i++) for(let j=i+1;j<ents.length;j++) resCol(ents[i],ents[j]);
            }
            if(!moving&&balls.every(b=>Math.hypot(b.vx,b.vy)<0.1)) { gameState='waiting'; currentPlayer=currentPlayer===1?2:1; wallCombo=0; updateUI(); if(currentMode==='bot'&&currentPlayer===2) botTurn(); }
        }
        particles.forEach((p,i)=>{p.update();if(p.life<=0)particles.splice(i,1);}); trails.forEach(t=>t.size-=0.8*timeScale); trails=trails.filter(t=>t.size>2);
    }

    function resCol(c1,c2) {
        if(!c1||!c2) return; let dx=c2.x-c1.x; let dy=c2.y-c1.y; let dsq=dx*dx+dy*dy; let minD=c1.r+c2.r;
        if(dsq<minD*minD&&dsq>0) {
            let d=Math.sqrt(dsq); let nx=dx/d; let ny=dy/d; let over=minD-d;
            let m1=c1.isStatic?0:1/c1.m; let m2=c2.isStatic?0:1/c2.m; let sm=m1+m2; if(sm===0) return; let cor=over/sm;
            if(!c1.isStatic){c1.x-=nx*cor*m1;c1.y-=ny*cor*m1;} if(!c2.isStatic){c2.x+=nx*cor*m2;c2.y+=ny*cor*m2;}
            let kx=(c2.vx||0)-(c1.vx||0); let ky=(c2.vy||0)-(c1.vy||0); let vn=kx*nx+ky*ny; if(vn>0) return;
            let j=-(1+cfg.elasticity)*vn/sm; if(!c1.isStatic){c1.vx-=j*nx*m1;c1.vy-=j*ny*m1;} if(!c2.isStatic){c2.vx+=j*nx*m2;c2.vy+=j*ny*m2;}
            if(balls.includes(c1)||balls.includes(c2)){ triggerShake(); playTone(200,'square',0.1,0.2); }
        }
    }

    function drawShape(x, y, r, type, fill, stroke, lw) {
        ctx.fillStyle = fill; ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.beginPath();
        if(type==='square') ctx.rect(x-r, y-r, r*2, r*2);
        else if(type==='hexagon') { for(let i=0;i<6;i++) { let a=Math.PI/3*i; ctx.lineTo(x+r*Math.cos(a), y+r*Math.sin(a)); } ctx.closePath(); }
        else if(type==='triangle') { ctx.moveTo(x,y-r); ctx.lineTo(x+r,y+r); ctx.lineTo(x-r,y+r); ctx.closePath(); }
        else if(type==='diamond') { ctx.moveTo(x,y-r*1.2); ctx.lineTo(x+r*1.2,y); ctx.lineTo(x,y+r*1.2); ctx.lineTo(x-r*1.2,y); ctx.closePath(); }
        else ctx.arc(x,y,r,0,Math.PI*2);
        ctx.fill(); if(lw>0) ctx.stroke();
    }

    function draw() {
        let cBg = getCSSVar('--c-black'); let cBox = getCSSVar('--c-white'); let cRed = getCSSVar('--c-red'); let cBlue = getCSSVar('--c-blue'); let cYel = getCSSVar('--c-yellow');
        ctx.fillStyle = cBg; ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.save(); if(shakeTime>0) { ctx.translate((Math.random()-0.5)*12,(Math.random()-0.5)*12); shakeTime--; }

        if(currentTheme==='hazard') {
            ctx.fillStyle = cYel;
            for(let i=-100; i<Math.max(canvas.width,canvas.height)+100; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i+20,0); ctx.lineTo(0,i+20); ctx.lineTo(0,i); ctx.fill(); ctx.beginPath(); ctx.moveTo(canvas.width,i); ctx.lineTo(canvas.width,i+20); ctx.lineTo(canvas.width-i-20,canvas.height); ctx.lineTo(canvas.width-i,canvas.height); ctx.fill(); }
            ctx.fillStyle = cBg; ctx.fillRect(20,20,canvas.width-40,canvas.height-40);
        } else if(currentTheme==='blueprint') {
            ctx.fillStyle = '#002B7F'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.strokeStyle='#4DA6FF'; ctx.lineWidth=1;
            for(let x=20;x<canvas.width;x+=40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
            for(let y=20;y<canvas.height;y+=40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }
            ctx.strokeStyle = cBox; ctx.lineWidth=4; ctx.strokeRect(10,10,canvas.width-20,canvas.height-20);
        } else if(currentTheme==='terminal') {
            ctx.fillStyle = '#000'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.strokeStyle='#0F0'; ctx.lineWidth=2;
            let scan=(frameCount*3)%canvas.height; ctx.beginPath(); ctx.moveTo(0,scan); ctx.lineTo(canvas.width,scan); ctx.stroke();
        } else if(currentTheme==='minimal') {
            ctx.fillStyle = cBox; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.strokeStyle=cBg; ctx.lineWidth=4; ctx.strokeRect(20,20,canvas.width-40,canvas.height-40);
        }

        let lCol = currentTheme==='minimal' ? cBg : cBox;
        ctx.strokeStyle = lCol; ctx.lineWidth = 4; ctx.setLineDash([15,15]); ctx.beginPath(); ctx.moveTo(0,canvas.height/2); ctx.lineTo(canvas.width,canvas.height/2); ctx.stroke();
        ctx.setLineDash([]); ctx.beginPath(); ctx.arc(canvas.width/2,canvas.height/2,60,0,Math.PI*2); ctx.stroke();
        ctx.strokeRect(goalX-20,0,goalWidth+40,60); ctx.strokeRect(goalX-20,canvas.height-60,goalWidth+40,60);

        ctx.fillStyle = cBlue; ctx.fillRect(goalX,0,goalWidth,10); ctx.fillStyle = cRed; ctx.fillRect(goalX,canvas.height-10,goalWidth,10);
        ctx.strokeStyle = cBg; ctx.lineWidth = 4; ctx.strokeRect(goalX,0,goalWidth,10); ctx.strokeRect(goalX,canvas.height-10,goalWidth,10);

        obstacles.forEach(o => drawShape(o.x, o.y, o.r, 'square', cYel, cBg, 4));
        trails.forEach(t => drawShape(t.x, t.y, t.size/2, activeShape, cBox, cBg, 2));
        particles.forEach(p => p.draw());

        balls.forEach(b => drawShape(b.x, b.y, b.r, activeShape, cBox, cBg, 4));

        strikers.forEach(s => {
            let sc = s.isP1 ? cRed : cBlue;
            if(s.id===currentPlayer && gameState==='waiting') { let ts=s.r+15; ctx.strokeStyle=sc; ctx.lineWidth=4; ctx.strokeRect(s.x-ts, s.y-ts, ts*2, ts*2); }
            drawShape(s.x, s.y, s.r, activeShape, sc, cBg, 4);
            if(cfg.useStamina) { ctx.fillStyle=cBg; ctx.fillRect(s.x+s.r+8,s.y-s.r,6,s.r*2); ctx.fillStyle=s.stamina>25?cYel:cRed; ctx.fillRect(s.x+s.r+9,s.y+s.r-(s.r*2*(s.stamina/100)),4,s.r*2*(s.stamina/100)); }
        });

        if(gameState==='dragging' && selectedStriker) {
            let dx=dragStart.x-dragCurrent.x; let dy=dragStart.y-dragCurrent.y; let d=Math.hypot(dx,dy); if(d>150){dx=(dx/d)*150;dy=(dy/d)*150;}
            ctx.strokeStyle = selectedStriker.isP1 ? cRed : cBlue; ctx.lineWidth=6; ctx.setLineDash([10,5]); ctx.lineDashOffset=-frameCount;
            ctx.beginPath(); ctx.moveTo(selectedStriker.x,selectedStriker.y); ctx.lineTo(selectedStriker.x+dx,selectedStriker.y+dy); ctx.stroke(); ctx.setLineDash([]);
        }
        ctx.restore();
    }

    function handleGoal(p) {
        if(p===1) score1++; else score2++; triggerShake(); triggerShake(); playTone(300,'sawtooth',0.5,0.4);
        let pop = document.getElementById("popup"); pop.innerText = "IMPACT!"; pop.classList.remove('show'); void pop.offsetWidth; pop.classList.add('show');
        gameState='waiting'; updateUI(); setTimeout(() => { if(score1>=cfg.winScore||score2>=cfg.winScore) { document.getElementById('winner-text').innerText = score1>=cfg.winScore?"P1 WINS":"P2 WINS"; gameState='gameover'; showScreen('game-over-screen'); } else resetPositions(); }, 1200);
    }
    
    function handleTimeOut() { document.getElementById('winner-text').innerText = score1>score2?"P1 WINS":(score2>score1?"P2 WINS":"DRAW"); gameState='gameover'; showScreen('game-over-screen'); }
    function resetPositions() { balls=[{x:canvas.width/2,y:canvas.height/2,r:cfg.ballRadius,vx:0,vy:0,m:1}]; strikers[0].x=canvas.width/2; strikers[0].y=canvas.height-120; strikers[0].vx=0; strikers[0].vy=0; strikers[1].x=canvas.width/2; strikers[1].y=120; strikers[1].vx=0; strikers[1].vy=0; gameState='waiting'; if(currentMode==='bot'&&currentPlayer===2) botTurn(); }
    function updateUI() { document.getElementById('score1').innerText=score1; document.getElementById('score2').innerText=score2; }

    function botTurn() { if(currentMode!=='bot'||currentPlayer!==2||gameState!=='waiting') return; setTimeout(() => { if(gameState!=='waiting') return; let b=balls[0], s=strikers[1]; if(!b) return; let dx=b.x-s.x, dy=b.y-s.y; dragStart={x:s.x,y:s.y}; dragCurrent={x:s.x-dx*0.8, y:s.y-dy*0.8}; selectedStriker=s; gameState='dragging'; setTimeout(()=>endInt({preventDefault:()=>{}}), 150); }, 300); }
    function getEPos(e) { let r=canvas.getBoundingClientRect(); return { x:((e.touches?e.touches[0].clientX:e.clientX)-r.left)*(canvas.width/r.width), y:((e.touches?e.touches[0].clientY:e.clientY)-r.top)*(canvas.height/r.height) }; }
    function startInt(e) { if(gameState!=='waiting'||(currentMode==='bot'&&currentPlayer===2)) return; e.preventDefault(); let s=strikers.find(x=>x.id===currentPlayer); if(cfg.useStamina&&s.stamina<20) return; selectedStriker=s; dragStart=dragCurrent=getEPos(e); gameState='dragging'; }
    function moveInt(e) { if(gameState==='dragging'&&selectedStriker) { e.preventDefault(); dragCurrent=getEPos(e); } }
    function endInt(e) { if(gameState!=='dragging'||!selectedStriker) return; if(e&&e.preventDefault) e.preventDefault(); let dx=dragStart.x-dragCurrent.x, dy=dragStart.y-dragCurrent.y; let d=Math.hypot(dx,dy); if(d>150){dx=(dx/d)*150;dy=(dy/d)*150;} selectedStriker.vx=dx*1.15; selectedStriker.vy=dy*1.15; if(d>5) { if(cfg.useStamina) selectedStriker.stamina-=25; gameState='moving'; playTone(100,'square',0.1,0.3); } else gameState='waiting'; selectedStriker=null; }

    canvas.addEventListener('mousedown',startInt); canvas.addEventListener('mousemove',moveInt); window.addEventListener('mouseup',endInt);
    canvas.addEventListener('touchstart',startInt,{passive:false}); canvas.addEventListener('touchmove',moveInt,{passive:false}); window.addEventListener('touchend',endInt);

    function gameLoop() { if(gameState!=='gameover') { update(); draw(); } gameLoopId=requestAnimationFrame(gameLoop); }
</script>
